name: 更新开奖数据

# 双色球每周二、四、日 21:15（北京时间）开奖，这里在次日凌晨 02:00 抓取，
# 换算成 UTC 就是前一天 18:00，所以 cron 的日子是 周日 / 周二 / 周四。
on:
  schedule:
    - cron: "0 18 * * 0,2,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 从 CSV 快照装载
        run: python -m lottery.cli restore

      - name: 抓取最新数据
        run: python -m lottery.cli crawl --recent 10

      - name: 导出 CSV 快照
        run: python -m lottery.cli export

      - name: 有新数据则提交
        env:
          TZ: Asia/Shanghai # 提交信息用北京日期，与 cron 注释对齐（默认 UTC 会差一天）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 本 job 运行期间远程可能被手动推送过，直接 push 会 non-fast-forward 失败。
          # 被拒时以远程为基准重置，再从库里重新导出：restore 会把远程新增的期号补进库，
          # export 写出的就是「本地抓到的 ∪ 远程已有的」，不会丢期号。
          for attempt in 1 2 3; do
            git add data/draws.csv
            if git diff --cached --quiet; then
              echo "没有新数据，跳过提交"
              exit 0
            fi
            git commit -m "数据：更新开奖记录 $(date +%F)"
            if git push origin HEAD:main; then
              echo "已推送（第 $attempt 次尝试）"
              exit 0
            fi
            echo "推送被拒（第 $attempt 次）：以远程为基准重新生成快照"
            git fetch origin
            git reset --hard origin/main
            python -m lottery.cli restore
            python -m lottery.cli export
            sleep 5
          done
          echo "::error::连续 3 次推送失败，检查仓库 Workflow permissions 是否允许写入" >&2
          exit 1
